[package]
name = "monitor"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "monitor"
path = "src/main.rs"

[[bin]]
name = "qusage"
path = "src/bin/qusage.rs"

[[bin]]
name = "qarray"
path = "src/bin/qarray.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ansi-to-tui = "7.0"
notify = "6.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
